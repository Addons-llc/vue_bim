[project]
name = "bim_supplier_store"
authors = [
    { name = "BuyInMinutes Development Team" }
]
description = "Minimal Supplier Store DocType for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bim_supplier_store*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]

[tool.setuptools.dynamic]
version = { attr = "bim_supplier_store.__version__" }

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
